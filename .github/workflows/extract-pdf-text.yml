name: Extract text from PDFs

on:
  push:
    paths:
      - '**.pdf'
      - '.github/workflows/extract-pdf-text.yml'
      - 'scripts/extract_pdfs.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-text-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install Python packages
        run: python -m pip install --upgrade pymupdf pillow pytesseract

      - name: Extract text and OCR scanned pages
        run: python scripts/extract_pdfs.py

      - name: Commit extracted text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf-extracted/
          if git diff --cached --quiet; then
            echo "No extracted text changes to commit."
          else
            git commit -m "Add extracted text from PDFs"
            git push
          fi
